name: Documentation improvement
about: Report documentation drift, unclear wording, or a broken path
labels: [documentation]
body:
  - type: input
    id: path
    attributes:
      label: File or URL
      placeholder: docs/example.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear, stale, or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
